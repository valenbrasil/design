name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Publica também a partir da branch de trabalho, para que o site fique
      # disponível antes do merge. Depois que o PR for integrado, esta linha
      # pode sair e o deploy passa a acontecer só a partir da main.
      - claude/design-system-github-u5p1m4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy em andamento pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita o Pages via API caso ainda não esteja ligado no repositório.
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          # O site é estático: index.html na raiz, tokens/, assets/ e os
          # HTMLs autocontidos em ui_kits/.
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
