<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar | Painel Valen Brasil</title>
<link rel="stylesheet" href="../../styles.css">
<!--
  Wrapper HTML autônomo para Login.jsx (components_out não inclui um bundler
  de página para telas isoladas — apenas para website/blog/dashboard, que já
  chegam prontos em index.html). Este arquivo recria LoginScreen() com React 18
  UMD + Babel standalone via CDN, sem etapa de build, para permitir abrir a
  tela de login diretamente no navegador.

  Duas adaptações em relação ao Login.jsx original:
  1. Os dois <img> que usavam o componente Logo (que aponta por padrão para
     assets/valen-logo.png e assets/valen-icone.png) foram trocados por tags
     <img> apontando para os arquivos reais deste repositório,
     assets/logo-valen-brasil.png e assets/selo-valen-brasil.png — os nomes
     não batem entre o componente genérico e os arquivos de marca entregues.
  2. Fora isso, marcação, textos e comportamento (validação de e-mail,
     redirecionamento para index.html) são os mesmos do componente fonte em
     Login.jsx.
-->
<style>
  body { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ---- components/core/Icon.jsx (inline, sem import/export) ---- */
const ICON_BASE = "https://unpkg.com/lucide-static@0.428.0/icons/";
function Icon({ name, size = 20, style, className }) {
  const url = ICON_BASE + name + ".svg";
  return (
    <span
      aria-hidden="true"
      className={className}
      style={{
        display: "inline-block",
        width: size,
        height: size,
        flexShrink: 0,
        background: "currentColor",
        WebkitMaskImage: "url(" + url + ")",
        maskImage: "url(" + url + ")",
        WebkitMaskSize: "contain",
        maskSize: "contain",
        WebkitMaskRepeat: "no-repeat",
        maskRepeat: "no-repeat",
        WebkitMaskPosition: "center",
        maskPosition: "center",
        ...style,
      }}
    />
  );
}

/* ---- components/forms/Field.jsx (inline) ---- */
function Field({ label, htmlFor, hint, error, required, children, style }) {
  return (
    <div style={{ display: "grid", gap: 6, ...style }}>
      {label ? (
        <label htmlFor={htmlFor} style={{ font: "var(--type-label)", color: "var(--text-strong)" }}>
          {label}
          {required ? <span style={{ color: "var(--danger-500)" }}> *</span> : null}
        </label>
      ) : null}
      {children}
      {error ? (
        <span style={{ font: "var(--type-body-sm)", color: "var(--danger-500)" }}>{error}</span>
      ) : hint ? (
        <span style={{ font: "var(--type-body-sm)", color: "var(--text-muted)" }}>{hint}</span>
      ) : null}
    </div>
  );
}

/* ---- components/forms/Input.jsx (inline) ---- */
function Input({ id, value, defaultValue, placeholder, type = "text", size = "md", iconLeft, invalid, disabled, onChange, style }) {
  const [focus, setFocus] = useState(false);
  const h = size === "sm" ? "var(--control-h-sm)" : size === "lg" ? "var(--control-h-lg)" : "var(--control-h-md)";
  return (
    <div style={{ position: "relative", display: "flex", alignItems: "center" }}>
      {iconLeft ? (
        <Icon name={iconLeft} size={16} style={{ position: "absolute", left: 12, color: "var(--text-muted)" }} />
      ) : null}
      <input
        id={id}
        type={type}
        value={value}
        defaultValue={defaultValue}
        placeholder={placeholder}
        disabled={disabled}
        onChange={onChange}
        onFocus={() => setFocus(true)}
        onBlur={() => setFocus(false)}
        style={{
          width: "100%",
          height: h,
          padding: iconLeft ? "0 var(--space-3) 0 34px" : "0 var(--space-3)",
          font: "var(--type-body-sm)",
          color: "var(--text-strong)",
          background: disabled ? "var(--neutral-100)" : "var(--surface-card)",
          border: "1px solid " + (invalid ? "var(--danger-500)" : focus ? "var(--ring)" : "var(--input)"),
          borderRadius: "var(--radius-control)",
          boxShadow: focus ? "var(--ring-focus)" : "none",
          outline: "none",
          transition: "var(--transition-control)",
          ...style,
        }}
      />
    </div>
  );
}

/* ---- components/core/Button.jsx (inline) ---- */
const BTN_SIZES = {
  sm: { height: "var(--control-h-sm)", padding: "0 var(--space-3)", font: "var(--type-body-sm)", gap: 6, icon: 16 },
  md: { height: "var(--control-h-md)", padding: "0 var(--space-4)", font: "var(--type-label)", gap: 8, icon: 18 },
  lg: { height: "var(--control-h-lg)", padding: "0 var(--space-6)", font: "var(--type-body)", gap: 10, icon: 20 },
};
const BTN_VARIANTS = {
  primary: { bg: "var(--primary)", fg: "var(--primary-foreground)", border: "transparent", bgHover: "var(--sage-600)" },
  secondary: { bg: "var(--secondary)", fg: "var(--secondary-foreground)", border: "transparent", bgHover: "var(--neutral-200)" },
  outline: { bg: "transparent", fg: "var(--text-strong)", border: "var(--border-strong)", bgHover: "var(--neutral-100)" },
  ghost: { bg: "transparent", fg: "var(--text-body)", border: "transparent", bgHover: "var(--neutral-100)" },
  link: { bg: "transparent", fg: "var(--text-brand)", border: "transparent", bgHover: "transparent" },
  destructive: { bg: "var(--destructive)", fg: "var(--destructive-foreground)", border: "transparent", bgHover: "var(--danger-700)" },
};
function Button({ children, variant = "primary", size = "md", iconLeft, iconRight, fullWidth, disabled, href, type = "button", onClick, style }) {
  const [hover, setHover] = useState(false);
  const [press, setPress] = useState(false);
  const s = BTN_SIZES[size] || BTN_SIZES.md;
  const v = BTN_VARIANTS[variant] || BTN_VARIANTS.primary;
  const Tag = href ? "a" : "button";
  const css = {
    display: fullWidth ? "flex" : "inline-flex",
    width: fullWidth ? "100%" : undefined,
    alignItems: "center",
    justifyContent: "center",
    gap: s.gap,
    height: s.height,
    padding: variant === "link" ? 0 : s.padding,
    font: s.font,
    letterSpacing: "var(--tracking-normal)",
    background: hover && !disabled ? v.bgHover : v.bg,
    color: v.fg,
    border: "1px solid " + v.border,
    borderRadius: "var(--radius-control)",
    textDecoration: variant === "link" && hover ? "underline" : "none",
    cursor: disabled ? "not-allowed" : "pointer",
    opacity: disabled ? 0.45 : 1,
    transform: press && !disabled ? "scale(0.985)" : "none",
    transition: "var(--transition-control), transform var(--duration-fast) var(--ease-in-out)",
    whiteSpace: "nowrap",
    ...style,
  };
  return (
    <Tag
      href={href}
      type={href ? undefined : type}
      disabled={href ? undefined : disabled}
      onClick={disabled ? undefined : onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => { setHover(false); setPress(false); }}
      onMouseDown={() => setPress(true)}
      onMouseUp={() => setPress(false)}
      style={css}
    >
      {iconLeft ? <Icon name={iconLeft} size={s.icon} /> : null}
      {children}
      {iconRight ? <Icon name={iconRight} size={s.icon} /> : null}
    </Tag>
  );
}

/* ---- components/forms/Checkbox.jsx (inline) ---- */
function Checkbox({ label, checked, defaultChecked, disabled, onChange, style }) {
  const [internal, setInternal] = useState(!!defaultChecked);
  const on = checked === undefined ? internal : checked;
  const toggle = () => {
    if (disabled) return;
    if (checked === undefined) setInternal(!on);
    onChange && onChange(!on);
  };
  return (
    <label onClick={toggle} style={{ display: "inline-flex", alignItems: "center", gap: "var(--space-2)", cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.5 : 1, ...style }}>
      <span style={{ width: 18, height: 18, borderRadius: "var(--radius-sm)", display: "inline-flex", alignItems: "center", justifyContent: "center", background: on ? "var(--primary)" : "var(--surface-card)", color: "var(--primary-foreground)", border: "1px solid " + (on ? "var(--primary)" : "var(--input)"), transition: "var(--transition-control)" }}>
        {on ? <Icon name="check" size={13} /> : null}
      </span>
      {label ? <span style={{ font: "var(--type-body-sm)", color: "var(--text-body)" }}>{label}</span> : null}
    </label>
  );
}

/* ---- components/core/Separator.jsx (inline, apenas variante com label) ---- */
function Separator({ label, style }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "var(--space-3)", ...style }}>
      <span style={{ flex: 1, height: 1, background: "var(--border-subtle)" }} />
      <span style={{ font: "var(--type-eyebrow)", textTransform: "uppercase", letterSpacing: "var(--tracking-widest)", color: "var(--text-muted)" }}>{label}</span>
      <span style={{ flex: 1, height: 1, background: "var(--border-subtle)" }} />
    </div>
  );
}

/* ---- components/feedback/Alert.jsx (inline) ---- */
const ALERT_TONES = {
  info: { bg: "var(--info-50)", fg: "var(--info-700)", icon: "info" },
  success: { bg: "var(--success-50)", fg: "var(--success-700)", icon: "circle-check" },
  warning: { bg: "var(--warning-50)", fg: "var(--warning-700)", icon: "triangle-alert" },
  danger: { bg: "var(--danger-50)", fg: "var(--danger-700)", icon: "circle-alert" },
  brand: { bg: "var(--surface-brand-subtle)", fg: "var(--sage-700)", icon: "badge-check" },
};
function Alert({ title, children, tone = "info", icon, style }) {
  const t = ALERT_TONES[tone] || ALERT_TONES.info;
  return (
    <div style={{ display: "flex", gap: "var(--space-3)", background: t.bg, borderRadius: "var(--radius-md)", padding: "var(--space-4)", border: "1px solid transparent", ...style }}>
      <Icon name={icon || t.icon} size={18} style={{ color: t.fg, marginTop: 1 }} />
      <div style={{ display: "grid", gap: 2 }}>
        {title ? <strong style={{ font: "var(--type-label)", color: t.fg }}>{title}</strong> : null}
        {children ? <div style={{ font: "var(--type-body-sm)", color: "var(--text-body)" }}>{children}</div> : null}
      </div>
    </div>
  );
}

/* ---- components/core/Badge.jsx (inline) ---- */
const BADGE_TONES = {
  neutral: ["var(--neutral-100)", "var(--neutral-700)"],
  brand: ["var(--sage-50)", "var(--sage-700)"],
  solid: ["var(--primary)", "var(--primary-foreground)"],
  success: ["var(--success-50)", "var(--success-700)"],
  warning: ["var(--warning-50)", "var(--warning-700)"],
  danger: ["var(--danger-50)", "var(--danger-700)"],
  info: ["var(--info-50)", "var(--info-700)"],
  outline: ["transparent", "var(--text-body)"],
};
function Badge({ children, tone = "neutral", size = "md", style }) {
  const [bg, fg] = BADGE_TONES[tone] || BADGE_TONES.neutral;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, background: bg, color: fg, border: "1px solid " + (tone === "outline" ? "var(--border-strong)" : "transparent"), borderRadius: "var(--radius-pill)", padding: size === "sm" ? "2px 8px" : "4px 10px", font: "var(--type-eyebrow)", fontWeight: "var(--weight-medium)", letterSpacing: "0.02em", ...style }}>
      {children}
    </span>
  );
}

/* ---- ui_kits/dashboard/Login.jsx: LoginScreen (adaptado) ---- */
function LoginScreen() {
  const [email, setEmail] = useState("");
  const [erro, setErro] = useState(false);
  const entrar = (e) => {
    e.preventDefault();
    if (!email.includes("@")) {
      setErro(true);
      return;
    }
    setErro(false);
    window.location.href = "index.html";
  };
  return (
    <div style={{ minHeight: "100vh", display: "grid", gridTemplateColumns: "1fr 1fr", background: "var(--surface-page)" }}>
      <div style={{ display: "flex", flexDirection: "column", justifyContent: "space-between", padding: "var(--space-10) var(--space-12)" }}>
        <img src="../../assets/logo-valen-brasil.png" alt="Valen Brasil" style={{ height: 20, width: "auto", display: "block" }} />
        <form onSubmit={entrar} style={{ width: "100%", maxWidth: 380, margin: "0 auto", display: "grid", gap: "var(--space-5)" }}>
          <div style={{ display: "grid", gap: "var(--space-2)" }}>
            <h1 style={{ font: "var(--type-h2)", fontSize: "2rem" }}>Acessar o painel</h1>
            <p style={{ font: "var(--type-body-sm)", color: "var(--text-muted)" }}>Gestão de laudos de avaliação da Valen Brasil.</p>
          </div>
          {erro ? (
            <Alert tone="danger" title="Não foi possível entrar">
              Verifique o e-mail informado e tente novamente.
            </Alert>
          ) : null}
          <Field label="E-mail" htmlFor="email" required={true}>
            <Input
              id="email"
              type="email"
              placeholder="nome@valenbrasil.com"
              iconLeft="mail"
              value={email}
              invalid={erro}
              onChange={(e) => setEmail(e.target.value)}
            />
          </Field>
          <Field label="Senha" htmlFor="senha" required={true}>
            <Input id="senha" type="password" placeholder="••••••••" iconLeft="lock" />
          </Field>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <Checkbox label="Manter conectado" defaultChecked={true} />
            <a href="#" style={{ font: "var(--type-body-sm)" }}>Esqueci minha senha</a>
          </div>
          <Button type="submit" size="lg" fullWidth={true} iconRight="arrow-right">Entrar</Button>
          <Separator label="ou" />
          <Button variant="outline" size="lg" fullWidth={true} iconLeft="building-2">Entrar com conta corporativa</Button>
          <p style={{ font: "var(--type-body-sm)", color: "var(--text-muted)", textAlign: "center" }}>
            Ainda não tem acesso? <a href="https://wa.me/554731701572">Fale com a equipe</a>
          </p>
        </form>
        <span style={{ font: "var(--type-mono)", fontSize: 11, color: "var(--text-muted)" }}>
          CNPJ 39.819.814/0001-98 • CAU PJ69468-1 • CRECI 11689-J
        </span>
      </div>
      <aside style={{ background: "var(--surface-contrast)", borderLeft: "1px solid var(--sage-200)", padding: "var(--space-12)", display: "flex", flexDirection: "column", justifyContent: "center", gap: "var(--space-8)" }}>
        <Badge tone="brand">NBR 14653</Badge>
        <h2 style={{ font: "var(--type-h2)", color: "var(--sage-800)", maxWidth: "16ch" }}>
          Seu patrimônio é único. Seu valor também.
        </h2>
        <div style={{ display: "grid", gap: "var(--space-4)", maxWidth: 420 }}>
          {[
            ["shield-check", "Responsabilidade Técnica", "RRT de perito arquiteto ou ART de engenheiro em todo laudo completo."],
            ["users", "Equipe Multidisciplinar", "Arquitetos, engenheiros e corretores atuando de forma integrada."],
            ["calendar-check", "Entrega em 3 dias úteis", "Avaliação mercadológica com prazo fechado."],
          ].map(([ic, t, d]) => (
            <div key={t} style={{ display: "flex", gap: "var(--space-3)" }}>
              <Icon name={ic} size={20} style={{ color: "var(--sage-600)", marginTop: 2 }} />
              <div>
                <div style={{ font: "var(--type-label)", color: "var(--sage-800)" }}>{t}</div>
                <div style={{ font: "var(--type-body-sm)", color: "var(--sage-700)" }}>{d}</div>
              </div>
            </div>
          ))}
        </div>
        <img src="../../assets/selo-valen-brasil.png" alt="" style={{ width: 56, opacity: 0.8 }} />
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LoginScreen />);
</script>
</body>
</html>
