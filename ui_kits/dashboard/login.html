<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — Painel Valen Brasil</title>
<link rel="icon" href="../../assets/valen-icone.png">
<link rel="stylesheet" href="../../styles.css">
</head>
<body>

<div id="root"></div>

<!--
  A tela renderiza o LoginScreen real do design system, não uma cópia:
  guia/ds-bundle.js traz os componentes compilados (Field, Input, Button,
  Checkbox, Separator, Alert, Icon, Badge, Logo) e a própria composição de
  ui_kits/dashboard/Login.jsx. Assim esta página não diverge do sistema.

  __VALEN_ICON_BASE precisa ser definido ANTES do bundle: os ícones são
  servidos de assets/icons/, e esta página está dois níveis abaixo da raiz.
-->
<script>window.__VALEN_ICON_BASE = "../../assets/icons/";</script>
<script src="../../guia/react.min.js"></script>
<script src="../../guia/react-dom.min.js"></script>
<script src="../../guia/ds-bundle.js"></script>
<script>
  ReactDOM.createRoot(document.getElementById("root"))
    .render(React.createElement(window.LoginScreen));
</script>

<script>window.__VALEN_GATE_BASE="../../";</script><script src="../../guia/gate.js"></script></body>
</html>
